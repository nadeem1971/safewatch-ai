  <text x="44" y="202" font-size="11" fill="#8A97A4">On-ground evidence</text>
  <text x="44" y="216" font-size="11" fill="#8A97A4">&amp; regulatory corpus</text>

  <rect x="196" y="152" width="270" height="78" rx="7" fill="#FFFFFF" stroke="#D5DEE7" stroke-width="1.3"/>
  <text x="212" y="176" font-size="13" font-weight="600" fill="#123A5E">Site Imagery</text>
  <text x="212" y="196" font-size="11.5" fill="#5A6B7B">Construction cameras, industrial</text>
  <text x="212" y="212" font-size="11.5" fill="#5A6B7B">CCTV, mobile inspection photos</text>

  <rect x="484" y="152" width="270" height="78" rx="7" fill="#FFFFFF" stroke="#D5DEE7" stroke-width="1.3"/>
  <text x="500" y="176" font-size="13" font-weight="600" fill="#123A5E">Compliance Documents</text>
  <text x="500" y="196" font-size="11.5" fill="#5A6B7B">Permit-to-Work, method</text>
  <text x="500" y="212" font-size="11.5" fill="#5A6B7B">statements, risk assessments</text>

  <rect x="772" y="152" width="278" height="78" rx="7" fill="#FFFFFF" stroke="#D5DEE7" stroke-width="1.3"/>
  <text x="788" y="176" font-size="13" font-weight="600" fill="#123A5E">Regulatory Knowledge Base</text>
  <text x="788" y="196" font-size="11.5" fill="#5A6B7B">OSHAD, TRAKHEES, MOMRA,</text>
  <text x="788" y="212" font-size="11.5" fill="#5A6B7B">ISO 45001</text>

  <line x1="550" y1="230" x2="550" y2="252" stroke="#5A6B7B" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ LAYER 2 ============ -->
  <line x1="44" y1="248" x2="1056" y2="248" stroke="#E4EAF0" stroke-width="1"/>
