<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1420" width="1100" height="1420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6B7B"/>
    </marker>
    <marker id="arwLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA7B4"/>
    </marker>
    <linearGradient id="v1band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="1420" fill="#FFFFFF"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="46" font-size="27" font-weight="700" fill="#123A5E">SafeWatch AI</text>
  <text x="40" y="70" font-size="14.5" fill="#5A6B7B">Agentic Site Safety &amp; Compliance Platform — Reference Architecture (Azure)</text>
  <text x="40" y="90" font-size="12.5" fill="#8A97A4" font-style="italic">The LLM proposes  ·  Deterministic policy disposes  ·  A human approves</text>

  <!-- legend -->
  <rect x="800" y="34" width="14" height="14" rx="3" fill="#1F4E79"/>
  <text x="822" y="46" font-size="12.5" fill="#3A4A5A">v1 — In scope</text>
  <rect x="800" y="58" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#9AA7B4" stroke-width="1.4" stroke-dasharray="3,2"/>
  <text x="822" y="70" font-size="12.5" fill="#3A4A5A">Phase 2 — Roadmap</text>

  <!-- ===== v1 BAND BACKGROUND ===== -->
  <rect x="28" y="112" width="1044" height="962" rx="10" fill="url(#v1band)" stroke="#1F4E79" stroke-width="1.6"/>
  <rect x="28" y="112" width="1044" height="26" rx="10" fill="#1F4E79"/>
  <rect x="28" y="128" width="1044" height="10" fill="#1F4E79"/>
